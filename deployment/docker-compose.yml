version: '3.8'

services:
  skillsprint-ai:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: skillsprint_ai_service
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-skillsprint-ai-super-secret-key-32-chars-minimum}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PASS_THRESHOLD=75.0
    volumes:
      - ../skillsprint.db:/app/skillsprint.db
      - ../reports:/app/reports
    restart: unless-stopped
